topic: 高中各科学习方法论
description: 涵盖语数英物化政史地九科的知识体系和学习方法，以及综合学习策略

items:
  # 一、数学
  - name: 数学知识体系
    description: 函数/几何/代数/概率统计/导数各模块的知识结构与内在联系
  - name: 数学怎么学
    description: 断节点排查、刻意练习、题型分类的具体操作方法

  # 二、物理
  - name: 物理知识体系
    description: 力学/热学/电磁学/光学/实验各模块的知识结构
  - name: 物理怎么学
    description: 模型化学习、受力分析、物理图像法的具体操作

  # 三、化学
  - name: 化学知识体系
    description: 反应类型/有机化学/元素化学/化学平衡的知识结构
  - name: 化学怎么学
    description: 反应规律、方程式记忆、分类体系的具体方法

  # 四、英语
  - name: 英语知识体系
    description: 词汇/语法/阅读/写作各模块的知识结构
  - name: 英语怎么学
    description: 间隔重复、精读策略、写作模板的具体操作

  # 五、语文
  - name: 语文知识体系
    description: 文言文/现代文/作文各模块的知识结构
  - name: 语文怎么学
    description: 实词虚词积累、答题套路、素材模板的具体方法

  # 六、政治
  - name: 政治知识体系
    description: 经济/政治/文化/哲学各模块的知识结构
  - name: 政治怎么学
    description: 框架记忆、时事关联、政治事件串联的具体方法

  # 七、历史
  - name: 历史知识体系
    description: 时间线/历史事件/历史人物的纵向知识结构
  - name: 历史怎么学
    description: 时间线串联法、因果分析、史料解读的具体操作

  # 八、地理
  - name: 地理知识体系
    description: 自然地理/人文地理/区域地理的知识结构
  - name: 地理怎么学
    description: 地图判读、自然规律总结、人文地理模板的具体方法

  # 九、综合（各科通用）
  - name: 预习方法
    description: 课前预习的目标、步骤和注意事项
  - name: 听课方法
    description: 课堂高效听讲的技巧和重点捕捉
  - name: 复习方法
    description: 课后复习的策略和时间安排
  - name: 考试策略
    description: 考前准备、答题顺序、时间分配的技巧
  - name: 错题本体系
    description: 错题的记录、归因、分类和复习流程
  - name: 刻意练习
    description: 在弱项上集中火力的具体操作方法
  - name: 遗忘曲线
    description: 科学复习节点的安排和复习方法
  - name: 主动回忆
    description: 闭卷回忆、检验真实掌握程度的操作
  - name: 间隔重复
    description: 利用遗忘曲线安排复习间隔的方法
  - name: 时间管理
    description: 每日/每周时间分配和优先级安排

execution:
  batch_size: 3
  items_per_agent: 8-9
  output_dir: D:/projects/private/chinese_high_school_subjects_learning_methods/results
